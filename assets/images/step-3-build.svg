<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" width="100%" height="100%">
  <!-- Code editor window -->
  <rect x="55" y="38" width="290" height="164" rx="12" fill="#ffffff" stroke="#0079ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="55" y="38" width="290" height="28" rx="12" fill="#0079ff" fill-opacity="0.08"/>
  <circle cx="75" cy="52" r="4" fill="#ef8354"/>
  <circle cx="89" cy="52" r="4" fill="#f9c74f"/>
  <circle cx="103" cy="52" r="4" fill="#8bc34a"/>
  
  <!-- Code lines -->
  <text x="80" y="90" font-family="monospace" font-size="12" fill="#0079ff" font-weight="bold">const</text>
  <text x="120" y="90" font-family="monospace" font-size="12" fill="#0f172a">app =</text>
  <text x="165" y="90" font-family="monospace" font-size="12" fill="#0284c7">createStack({</text>
  
  <text x="100" y="115" font-family="monospace" font-size="12" fill="#64748b">performance:</text>
  <text x="198" y="115" font-family="monospace" font-size="12" fill="#16a34a" font-weight="bold">'100/100',</text>
  
  <text x="100" y="140" font-family="monospace" font-size="12" fill="#64748b">architecture:</text>
  <text x="203" y="140" font-family="monospace" font-size="12" fill="#ea580c">'scalable'</text>
  
  <text x="80" y="165" font-family="monospace" font-size="12" fill="#0284c7">});</text>
  
  <!-- Terminal status tag -->
  <rect x="235" y="156" width="98" height="34" rx="8" fill="#0079ff" fill-opacity="0.1" stroke="#0079ff" stroke-width="1.5"/>
  <circle cx="250" cy="173" r="4.5" fill="#16a34a"/>
  <text x="262" y="177" font-family="monospace" font-size="11" fill="#0079ff" font-weight="bold">BUILD OK</text>
</svg>
