<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 432" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="s4-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="s4-score-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="s4-chart-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #0079ff)" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="var(--color-primary, #0079ff)" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="s4-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Analytics / Web Vitals Dashboard Shell -->
  <g filter="url(#s4-shadow)">
    <!-- Main Shell Window -->
    <rect x="54" y="44" width="660" height="344" rx="14" fill="var(--footer-background, #091426)" fill-opacity="0.96" stroke="var(--color-primary, #0079ff)" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Window Top Header Bar -->
    <rect x="54" y="44" width="660" height="38" rx="14" fill="url(#s4-glass)"/>
    <circle cx="76" cy="63" r="5" fill="#ef4444"/>
    <circle cx="92" cy="63" r="5" fill="#f59e0b"/>
    <circle cx="108" cy="63" r="5" fill="#10b981"/>

    <text x="130" y="67" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Lighthouse &amp; Real User Metrics (RUM)</text>
    <rect x="584" y="52" width="116" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="642" y="67" font-family="monospace" font-size="9" font-weight="800" fill="#10b981" text-anchor="middle">✓ 100% AUDIT PASS</text>

    <!-- Left Block: Google PageSpeed 100 Gauge -->
    <g transform="translate(80, 100)">
      <rect x="0" y="0" width="180" height="268" rx="10" fill="var(--footer-background, #050d1a)" stroke="var(--color-primary, #0079ff)" stroke-opacity="0.25"/>
      <text x="90" y="30" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">PERFORMANCE SCORE</text>

      <!-- Circular Radial Ring -->
      <circle cx="90" cy="110" r="56" stroke="var(--footer-background, #0f223d)" stroke-width="10"/>
      <circle cx="90" cy="110" r="56" stroke="url(#s4-score-grad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="320 352" transform="rotate(-90 90 110)"/>
      <text x="90" y="118" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">100</text>
      <text x="90" y="138" font-family="monospace" font-size="9" font-weight="800" fill="#10b981" text-anchor="middle">OPTIMAL</text>

      <!-- 4 Badges Under Score -->
      <g transform="translate(14, 184)">
        <rect x="0" y="0" width="70" height="32" rx="6" fill="var(--footer-background, #0d213a)"/>
        <text x="35" y="14" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">LCP</text>
        <text x="35" y="26" font-family="monospace" font-size="10" font-weight="800" fill="#10b981" text-anchor="middle">0.6s</text>

        <rect x="82" y="0" width="70" height="32" rx="6" fill="var(--footer-background, #0d213a)"/>
        <text x="117" y="14" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">FID</text>
        <text x="117" y="26" font-family="monospace" font-size="10" font-weight="800" fill="#10b981" text-anchor="middle">8ms</text>

        <rect x="0" y="38" width="70" height="32" rx="6" fill="var(--footer-background, #0d213a)"/>
        <text x="35" y="52" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">CLS</text>
        <text x="35" y="64" font-family="monospace" font-size="10" font-weight="800" fill="#10b981" text-anchor="middle">0.00</text>

        <rect x="82" y="38" width="70" height="32" rx="6" fill="var(--footer-background, #0d213a)"/>
        <text x="117" y="52" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">TTFB</text>
        <text x="117" y="64" font-family="monospace" font-size="10" font-weight="800" fill="#10b981" text-anchor="middle">64ms</text>
      </g>
    </g>

    <!-- Right Block: Growth & Conversion Spline Chart -->
    <g transform="translate(276, 100)">
      <rect x="0" y="0" width="414" height="268" rx="10" fill="var(--footer-background, #050d1a)" stroke="var(--color-primary, #0079ff)" stroke-opacity="0.25"/>
      
      <!-- Chart Top Stats Bar -->
      <g transform="translate(20, 20)">
        <text x="0" y="12" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">EVOLUCIÓN DE CONVERSIÓN &amp; VELOCIDAD</text>
        
        <rect x="230" y="-4" width="70" height="22" rx="6" fill="var(--color-primary, #0079ff)" fill-opacity="0.2"/>
        <text x="265" y="11" font-family="monospace" font-size="9" font-weight="700" fill="var(--color-primary, #38bdf8)" text-anchor="middle">+64% Leads</text>

        <rect x="306" y="-4" width="70" height="22" rx="6" fill="#10b981" fill-opacity="0.2"/>
        <text x="341" y="11" font-family="monospace" font-size="9" font-weight="700" fill="#10b981" text-anchor="middle">0s Dropoff</text>
      </g>

      <!-- Chart Grid Lines -->
      <line x1="20" y1="90" x2="394" y2="90" stroke="var(--color-primary, #0079ff)" stroke-opacity="0.1" stroke-dasharray="3 3"/>
      <line x1="20" y1="140" x2="394" y2="140" stroke="var(--color-primary, #0079ff)" stroke-opacity="0.1" stroke-dasharray="3 3"/>
      <line x1="20" y1="190" x2="394" y2="190" stroke="var(--color-primary, #0079ff)" stroke-opacity="0.1" stroke-dasharray="3 3"/>

      <!-- Spline Area Fill -->
      <path d="M 20 220 C 70 215, 120 190, 180 150 C 240 110, 300 90, 350 65 C 375 52, 385 45, 394 40 L 394 220 L 20 220 Z" fill="url(#s4-chart-area)"/>

      <!-- Spline Stroke Curve -->
      <path d="M 20 220 C 70 215, 120 190, 180 150 C 240 110, 300 90, 350 65 C 375 52, 385 45, 394 40" fill="none" stroke="var(--color-primary, #0079ff)" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Data Key Points -->
      <circle cx="180" cy="150" r="5" fill="var(--color-primary, #0079ff)" stroke="#ffffff" stroke-width="2"/>
      <circle cx="350" cy="65" r="5" fill="var(--color-primary, #0079ff)" stroke="#ffffff" stroke-width="2"/>
      <circle cx="394" cy="40" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>

      <!-- Tooltip at peak -->
      <g transform="translate(310, 2)">
        <rect x="0" y="0" width="80" height="28" rx="6" fill="var(--footer-background, #0c1e38)" stroke="#10b981" stroke-width="1.5"/>
        <text x="40" y="18" font-family="monospace" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">Top 1% Web</text>
      </g>

      <!-- Month Axis Labels -->
      <g transform="translate(20, 244)">
        <text x="0" y="0" font-family="monospace" font-size="9" fill="#64748b">Mes 01</text>
        <text x="90" y="0" font-family="monospace" font-size="9" fill="#64748b">Mes 02</text>
        <text x="180" y="0" font-family="monospace" font-size="9" fill="#64748b">Lanzamiento</text>
        <text x="270" y="0" font-family="monospace" font-size="9" fill="#64748b">Optimización</text>
        <text x="350" y="0" font-family="monospace" font-size="9" font-weight="700" fill="var(--color-primary, #38bdf8)">Escala</text>
      </g>
    </g>
  </g>
</svg>
